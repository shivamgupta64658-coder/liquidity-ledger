<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquidity Ledger</title>
<meta name="description" content="Track your live liquid net worth: bank, cash, receivables, card dues and this month's pending spends.">
<meta name="theme-color" content="#12332E">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#12332E; --muted:#5B706B; --line:#D3DDD9;
  --plus:#1F7A4D; --minus:#B3261E; --warn:#9A6A00; --warnbg:#FFF2CC; --chip:#E1E9E6; --deep:#12332E; --ondeep:#EAF3F0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1816; --surface:#16231F; --ink:#E3EEEA; --muted:#93A8A2; --line:#2A3B36;
    --plus:#5CC48E; --minus:#F07B72; --warn:#F2C35B; --warnbg:#3A2F10; --chip:#22332E; --deep:#1E3A34; --ondeep:#EAF3F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1816; --surface:#16231F; --ink:#E3EEEA; --muted:#93A8A2; --line:#2A3B36;
  --plus:#5CC48E; --minus:#F07B72; --warn:#F2C35B; --warnbg:#3A2F10; --chip:#22332E; --deep:#1E3A34; --ondeep:#EAF3F0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
h1,h2,.num{font-family:Sora,Figtree,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--plus);outline-offset:2px}

/* Hero: the note's own equation */
.hero{background:var(--deep);color:var(--ondeep);margin:0 -16px;padding:20px 20px 22px;border-radius:0 0 22px 22px}
.hero .when{font-size:.86rem;opacity:.75}
.hero .big{font-family:Sora,sans-serif;font-weight:700;font-size:2.6rem;line-height:1.1;margin:4px 0 2px;letter-spacing:-.02em}
.hero .delta{font-size:.9rem;opacity:.85}
.eq{display:grid;grid-template-columns:1.2em 1fr auto;gap:6px 8px;margin-top:18px;font-size:.95rem}
.eq .op{opacity:.6;text-align:center}
.eq .lbl{opacity:.88}
.eq .val{font-family:Sora,sans-serif;font-weight:500;text-align:right}
.eq .rule{grid-column:1/-1;border-top:1px solid rgba(234,243,240,.3);margin:2px 0}
.eq button.lbl{all:unset;cursor:pointer;opacity:.88;text-decoration:underline;text-decoration-color:rgba(234,243,240,.3);text-underline-offset:3px}

section{margin-top:22px}
h2{font-size:1.05rem;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-family:Figtree,sans-serif;font-weight:500;color:var(--muted);font-size:.85rem}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .name{flex:1;min-width:0}
.row .name b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name span{color:var(--muted);font-size:.84rem}
.row .amt{font-family:Sora,sans-serif;font-weight:600;white-space:nowrap}
.row.off{opacity:.5}
.row.zero .amt{color:var(--muted);font-weight:500}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.soon{background:var(--warnbg);color:var(--warn)}
.tag.late{background:var(--minus);color:#fff}
.bar{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--plus)}
.empty{padding:18px 14px;color:var(--muted);font-size:.92rem}
.addrow{color:var(--plus);font-weight:600;justify-content:center}
.zeros{padding:10px 14px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;font-size:.8rem;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";display:block;width:22px;height:3px;border-radius:2px;background:var(--plus);margin:0 auto 6px}
nav.tabs button:not([aria-current="page"])::before{content:"";display:block;height:3px;margin-bottom:6px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--plus);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(18,51,46,.25);z-index:6}

/* Sheet */
dialog{border:0;padding:0;background:transparent;max-width:100vw;width:100%;margin:auto 0 0}
dialog::backdrop{background:rgba(8,20,17,.5)}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;max-height:88vh;overflow:auto}
.sheet h3{font-family:Sora,sans-serif;margin:0 0 12px;font-size:1.15rem}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input.amount{font-family:Sora,sans-serif;font-size:1.4rem;font-weight:600}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--plus);border-color:var(--plus);color:#fff}
.btn.danger{color:var(--minus)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.entries{margin-top:12px;font-size:.92rem}
.entries div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)}
.toggle{display:flex;align-items:center;gap:10px;margin:12px 0}
.toggle input{width:auto}
.note{color:var(--muted);font-size:.86rem;margin:8px 0 0}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto}
.status{font-size:.78rem;color:var(--muted);text-align:center;margin-top:28px}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .2s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}} }

.heroSeg{display:inline-flex;background:rgba(234,243,240,.12);border-radius:99px;padding:3px;gap:2px;margin-bottom:12px}
.heroSeg button{border:0;background:none;color:var(--ondeep);opacity:.75;padding:6px 14px;border-radius:99px;font-weight:600;font-size:.85rem}
.heroSeg button[aria-pressed="true"]{background:var(--ondeep);color:var(--deep);opacity:1}
.hero .proj{margin-top:6px;font-size:.92rem}
.hero .proj b{font-family:Sora,sans-serif;font-weight:600}
.banner{margin-top:16px;background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.banner button{border:0;background:var(--warn);color:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700}
.sub{font-size:.84rem;color:var(--muted)}
.over{color:var(--minus)}
.sched{width:100%;border-collapse:collapse;font-size:.85rem}
.sched th,.sched td{padding:6px 4px;text-align:right;border-top:1px dashed var(--line);white-space:nowrap}
.sched th:first-child,.sched td:first-child{text-align:left}
.sched th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px dashed var(--line);font-size:.95rem}
.kv:first-child{border-top:0}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:10px}
.pick{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.pick input{width:auto}
.pick .name{flex:1;min-width:0;font-size:.92rem}
.pick .amt{font-family:Sora,sans-serif;font-weight:600;white-space:nowrap}
nav.tabs button{font-size:.74rem;padding:10px 2px 12px}
</style>

</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <main id="view"></main>
  <p class="status" id="status">Opening your ledger…</p>
  <p class="status">Demo build. Not financial advice.</p>
</div>
<button class="fab" id="fab">Log expense</button>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script>
"use strict";
const TABS=[["home","Home"],["receive","Receive"],["pay","Pay"],["monthly","Monthly"],["wealth","Wealth"],["history","History"]];
const HOLD_TYPES=["Mutual fund","Stocks","EPF","PPF","NPS","Fixed deposit","Gold","Other"];
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");
const sgn=n=>(Math.round(n)<0?"−":"")+fmt(Math.abs(n));
const pm=n=>(Math.round(n)<0?"−":"+")+fmt(Math.abs(n));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const mKey=s=>(s||today()).slice(0,7);
const nextM=k=>{const d=parseD(k+"-01");return ymd(new Date(d.getFullYear(),d.getMonth()+1,1)).slice(0,7)};
const mLabel=k=>parseD(k+"-01").toLocaleDateString("en-IN",{month:"short",year:"numeric"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dShort=s=>s?parseD(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"";
const dLong=s=>s?parseD(s).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
const daysTo=s=>Math.round((parseD(s)-parseD(today()))/864e5);
const N=v=>{const x=parseFloat(String(v??"").replace(/,/g,""));return isNaN(x)?0:x};

let S=null, tab="home", heroMode="liquid";

function emptyState(){return{v:2,accounts:[{id:uid(),name:"Bank",balance:0},{id:uid(),name:"Cash",balance:0}],receivables:[],payables:[],budgets:[],incomes:[],holdings:[],properties:[],loans:[],log:[],snapshots:[],month:mKey()}}

/* Older backups (version 1) are upgraded in place */
function migrate(d){
  d=JSON.parse(JSON.stringify(d||{}));
  if(!d.v){
    const b=[];
    (d.expenses||[]).forEach(x=>b.push({id:x.id||uid(),kind:"exp",name:x.name,budget:N(x.monthly),carryOn:false,carryIn:0,spent:Math.max(0,N(x.monthly)-N(x.remaining))}));
    (d.investments||[]).forEach(x=>b.push({id:x.id||uid(),kind:"inv",name:x.name,budget:N(x.monthly),carryOn:false,carryIn:0,spent:Math.max(0,N(x.monthly)-N(x.remaining))}));
    d.budgets=b; delete d.expenses; delete d.investments;
    (d.receivables||[]).forEach(r=>{r.basis=r.counted===false?"off":"now"; delete r.counted});
    d.month=mKey(d.monthStarted); delete d.monthStarted;
    (d.log||[]).forEach(l=>{l.budgetId=l.catId||null; delete l.catId; delete l.fromBudget});
    d.v=2;
  }
  const e=emptyState(); for(const k in e) if(d[k]===undefined) d[k]=e[k];
  return d;
}

/* ---------- maths ---------- */
const rAmt=r=>r.entries.reduce((a,e)=>a+e.amt,0);
const avail=b=>b.budget+b.carryIn;
const left=b=>avail(b)-b.spent;
function addMonths(d,n,day){const y=d.getFullYear(),m=d.getMonth()+n;const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last))}
function firstEmiAfter(asOf,day){const a=parseD(asOf);let d=addMonths(a,0,day);if(d<=a)d=addMonths(a,1,day);return d}
function loanRun(L,stopStr){
  let bal=N(L.outstanding); const r=N(L.rate)/1200, emi=N(L.emi), day=N(L.emiDay)||1;
  const pre=(L.prepay||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)); let pi=0;
  let d=firstEmiAfter(L.asOf||today(),day); const stop=stopStr?parseD(stopStr):null; const rows=[]; let guard=0, stuck=false;
  while(bal>0.5&&guard++<720){
    if(stop&&d>stop) break;
    while(pi<pre.length&&parseD(pre[pi].date)<=d){bal=Math.max(0,bal-N(pre[pi].amt));pi++}
    if(bal<=0.5) break;
    const int=bal*r, pr=Math.min(bal,emi-int);
    if(pr<=0){stuck=true;break}
    bal-=pr; rows.push({date:ymd(d),int,pr,bal}); d=addMonths(d,1,day);
  }
  if(stop) while(pi<pre.length&&parseD(pre[pi].date)<=stop){bal=Math.max(0,bal-N(pre[pi].amt));pi++}
  return{bal:Math.max(0,bal),rows,stuck};
}
const loanBal=L=>loanRun(L,today()).bal;
function loanAhead(L){const L2={...L,outstanding:loanBal(L),asOf:today(),prepay:(L.prepay||[]).filter(p=>p.date>today())};return loanRun(L2,null)}
function propVal(p){
  if(N(p.dep)>0&&p.acqDate){const yrs=Math.max(0,(parseD(today())-parseD(p.acqDate))/(365.25*864e5));return N(p.cost)*Math.pow(1-N(p.dep)/100,yrs)}
  return N(p.estimate)||N(p.cost);
}
function totals(){
  const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const bank=sum(S.accounts,x=>x.balance);
  const recvNow=sum(S.receivables.filter(r=>r.basis==="now"),rAmt);
  const recvProj=sum(S.receivables.filter(r=>r.basis==="projected"),rAmt);
  const pay=sum(S.payables,p=>p.amount);
  const exp=sum(S.budgets.filter(b=>b.kind==="exp"),b=>Math.max(0,left(b)));
  const inv=sum(S.budgets.filter(b=>b.kind==="inv"),b=>Math.max(0,left(b)));
  const liqHold=sum(S.holdings.filter(h=>h.liquid),h=>N(h.value));
  const liquid=bank+recvNow+liqHold-pay-exp-inv;
  const ltInv=sum(S.holdings.filter(h=>!h.liquid),h=>N(h.value));
  const prop=sum(S.properties,propVal);
  const loans=sum(S.loans,loanBal);
  return{bank,recvNow,recvProj,pay,exp,inv,liqHold,liquid,projected:liquid+recvProj,ltInv,prop,loans,total:liquid+ltInv+prop-loans};
}
const breather=()=>S.budgets.filter(b=>b.carryOn).reduce((a,b)=>a+b.carryIn,0);

/* ---------- storage: this browser only ---------- */
function save(){try{localStorage.setItem("ledger",JSON.stringify(S))}catch(e){setStatus("Couldn’t save. Your browser may be blocking storage or be out of space.")}}
function commit(){save();render()}
function setStatus(t){document.getElementById("status").textContent=t}
function load(){
  let raw=null;try{raw=localStorage.getItem("ledger")}catch(e){}
  try{S=raw?migrate(JSON.parse(raw)):null}catch(e){S=null}
  if(S){save();render()}else renderStart();
  setStatus("Saved on this device only.");
}

/* ---------- render ---------- */
function renderStart(){
  document.getElementById("hero").innerHTML=`<div class="when">Liquidity Ledger</div><div class="big">Let’s set up</div>`;
  document.getElementById("view").innerHTML=`<section><div class="list"><div class="empty">See your real liquidity: what’s in the bank, plus what you’re owed, minus card dues and this month’s pending EMIs and SIPs. Add property, funds and loans to see your total net worth too. Everything stays on this device.</div><button class="row addrow" id="startBtn">Start my ledger</button><button class="row addrow" id="sampleBtn">Explore with sample data</button><button class="row addrow" id="impBtn">Import a backup file</button></div></section>`;
  document.getElementById("startBtn").onclick=()=>{S=emptyState();commit()};
  document.getElementById("sampleBtn").onclick=()=>{S=sampleState();commit()};
  document.getElementById("impBtn").onclick=importBackup;
  document.getElementById("tabs").innerHTML="";
  document.getElementById("fab").hidden=true;
}
function eqLine(op,label,go,v){return `<span class="op">${op}</span><button class="lbl" data-go="${go}">${label}</button><span class="val">${fmt(v)}</span>`}
function render(){
  const t=totals(), last=S.snapshots[S.snapshots.length-1];
  const isL=heroMode==="liquid", big=isL?t.liquid:t.total;
  const lastV=last?(isL?last.liquid:last.total):null;
  const delta=(lastV!=null)?big-lastV:null;
  document.getElementById("fab").hidden=false;
  document.getElementById("hero").innerHTML=`
    <div class="heroSeg" role="group" aria-label="Which net worth"><button data-hm="liquid" aria-pressed="${isL}">Liquid</button><button data-hm="total" aria-pressed="${!isL}">Total</button></div>
    <div class="when">${isL?"Liquid net worth":"Total net worth"}, ${new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}</div>
    <div class="big num">${sgn(big)}</div>
    <div class="delta">${delta!=null?`${delta>=0?"Up":"Down"} ${fmt(Math.abs(delta))} since ${dShort(last.date)}`:"Save a snapshot each week to see the trend"}</div>
    ${isL&&t.recvProj?`<div class="proj">Projected month-end <b>${sgn(t.projected)}</b>, once accrued income of ${fmt(t.recvProj)} arrives</div>`:""}
    <div class="eq">${isL?`
      <span class="op"></span><button class="lbl" data-go="home">In bank and cash</button><span class="val">${fmt(t.bank)}</span>
      ${eqLine("+","To receive","receive",t.recvNow)}
      ${t.liqHold?eqLine("+","Liquid investments","wealth",t.liqHold):""}
      ${eqLine("−","Card and other dues","pay",t.pay)}
      ${eqLine("−","Still to spend this month","monthly",t.exp)}
      ${eqLine("−","Still to invest this month","monthly",t.inv)}`:`
      <span class="op"></span><button class="lbl" data-hm="liquid">Liquid net worth</button><span class="val">${sgn(t.liquid)}</span>
      ${eqLine("+","Investments","wealth",t.ltInv)}
      ${eqLine("+","Property and assets","wealth",t.prop)}
      ${eqLine("−","Loans outstanding","wealth",t.loans)}`}
    </div>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-hm]").forEach(b=>b.onclick=()=>{heroMode=b.dataset.hm;render()});
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${k===tab?'aria-current="page"':""}>${l}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));
  const v=document.getElementById("view");
  v.innerHTML=({home:vHome,receive:vReceive,pay:vPay,monthly:vMonthly,wealth:vWealth,history:vHistory})[tab]();
  v.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id,b.dataset));
}
function go(k){tab=k;if(location.hash!=="#"+k)history.replaceState(null,"","#"+k);render();window.scrollTo({top:0})}

function monthBanner(){
  if(S.month>=mKey()) return "";
  return `<div class="banner"><span>${mLabel(mKey())} has started</span><button data-act="newmonth">Start ${mLabel(mKey()).split(" ")[0]}</button></div>`;
}
function vHome(){
  const due=S.payables.filter(p=>p.amount>0&&p.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4);
  const logs=[...S.log].reverse().slice(0,8);
  const ex=S.budgets.filter(b=>b.kind==="exp"), br=breather();
  const spent=ex.reduce((a,b)=>a+b.spent,0), av=ex.reduce((a,b)=>a+avail(b),0);
  return `${monthBanner()}
  <section><h2>Bank and cash</h2><div class="list">
    ${S.accounts.map(a=>`<button class="row ${a.balance?"":"zero"}" data-act="acct" data-id="${a.id}"><span class="name"><b>${esc(a.name)}</b></span><span class="amt">${fmt(a.balance)}</span></button>`).join("")}
    <button class="row addrow" data-act="acct">Add account</button></div></section>
  <section><h2>${mLabel(S.month)}</h2><div class="list">

  </div></section>`;
}
function srcName(src){const [k,id]=String(src).split(":");const x=(k==="a"?S.accounts:S.payables).find(y=>y.id===id);return x?x.name:"removed"}
function payRow(p){
  let tag=`<span class="tag">not due</span>`;
  if(p.amount===0) tag=""; else if(p.due){const d=daysTo(p.due);tag=`<span class="tag ${d<0?"late":d<=5?"soon":""}">${d<0?`${-d}d overdue`:d===0?"due today":dShort(p.due)}</span>`}

function recvRow(r){

}
function vReceive(){
  const g=b=>S.receivables.filter(r=>r.basis===b);

  const grp=(b,title,note)=>g(b).length?`<section><h2>${title} <small>${fmt(sumG(b))}</small></h2><div class="list">${g(b).map(recvRow).join("")}</div>${note?`<p class="note">${note}</p>`:""}</section>`:"";
  return `${grp("now","Counted now","")}
  ${grp("projected","Accrued income","Counted only in your projected month-end figure until it’s received or moved to a person.")}
  ${grp("off","Not counted","Tracked but left out of both figures.")}
  <section><div class="list"><button class="row addrow" data-act="recv">Add receivable</button></div>
  ${S.receivables.length?"":`<p class="note">Nobody owes you yet. Add friends, deposits or claims here.</p>`}</section>`;
}
function vPay(){
  const live=S.payables.filter(p=>p.amount>0).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));

  return `<section><h2>To pay <small>${fmt(dueSum)} billed</small></h2><div class="list">
    ${live.map(payRow).join("")||`<div class="empty">No dues. Nice.</div>`}

function budgetRows(kind){
  return S.budgets.filter(b=>b.kind===kind).map(b=>{
    const a=avail(b), l=left(b), used=a>0?Math.min(1,b.spent/a):1;

    return `<button class="row" data-act="budget" data-id="${b.id}"><span class="name"><b>${esc(b.name)}</b><span>${fmt(b.spent)} of ${fmt(a)}${carry}</span><div class="bar"><i style="width:${Math.max(0,used*100)}%;${l<0?"background:var(--minus)":""}"></i></div></span>${b.carryOn?`<span class="tag">carries</span>`:""}<span class="amt ${l<0?"minus":l===0?"plus":""}">${l<0?fmt(-l)+" over":l===0?"done":fmt(l)}</span></button>`}).join("");
}
function incomeRows(){
  return S.incomes.map(i=>{
    const r=S.receivables.find(x=>x.id===i.recvId), done=i.accrued.includes(S.month), out=r?rAmt(r):0;

function vMonthly(){

  return `${monthBanner()}
  <section><h2>${mLabel(S.month)} <small>${S.budgets.some(b=>b.carryOn)?`breather ${pm(br)}`:""}</small></h2></section>
  <section><h2>Income <small>${fmt(incT)} a month</small></h2><div class="list">${incomeRows()||`<div class="empty">Add salary, rent, reimbursements and anything else that comes in monthly.</div>`}<button class="row addrow" data-act="income">Add monthly income</button></div>
  <p class="note">Each month, income is accrued as a receivable. Mark it received into a bank account, or move it to the person who actually got the money.</p></section>

  <section><div class="list"><button class="row addrow" data-act="newmonth">${S.month<mKey()?`Start ${mLabel(mKey())}`:`Close ${mLabel(S.month)} early`}</button></div>
  <p class="note">Starting a month moves leftover or overspent amounts forward on lines set to carry, resets the rest, and accrues this month’s income.</p></section>`;
}
function vWealth(){
  const t=totals();
  const hv=S.holdings.reduce((a,h)=>a+N(h.value),0), hc=S.holdings.reduce((a,h)=>a+N(h.cost),0);
  const holds=[...S.holdings].sort((a,b)=>N(b.value)-N(a.value)).map(h=>{const g=N(h.value)-N(h.cost);
    return `<button class="row" data-act="hold" data-id="${h.id}"><span class="name"><b>${esc(h.name)}</b><span>${esc(h.type)}${h.liquid?", counted as liquid":""}${h.cost?`, ${pm(g)}`:""}${h.asOf?`, as of ${dShort(h.asOf)}`:""}</span></span><span class="amt">${fmt(h.value)}</span></button>`}).join("");
  const props=S.properties.map(p=>{const v=propVal(p),g=v-N(p.cost);const stale=!(N(p.dep)>0)&&p.estDate&&daysTo(p.estDate)<-365;
    return `<button class="row" data-act="prop" data-id="${p.id}"><span class="name"><b>${esc(p.name)}</b><span>${p.kind==="movable"?"Movable":"Immovable"}, cost ${fmt(p.cost)}, ${pm(g)}</span></span>${stale?`<span class="tag soon">update value</span>`:""}<span class="amt">${fmt(v)}</span></button>`}).join("");
  const loans=S.loans.map(L=>{const a=loanAhead(L);
    return `<button class="row" data-act="loan" data-id="${L.id}"><span class="name"><b>${esc(L.name)}</b><span>${a.stuck?"EMI doesn’t cover interest":`${fmt(L.emi)} EMI, ${a.rows.length} months left`}</span></span><span class="amt minus">${fmt(loanBal(L))}</span></button>`}).join("");
  return `<section><h2>Investments <small>${fmt(hv)}${hc?`, ${pm(hv-hc)}`:""}</small></h2><div class="list">${holds||`<div class="empty">Import your mutual fund statement, or add stocks, EPF, PPF and others.</div>`}
    <button class="row addrow" data-act="cas">Import mutual funds from CAS</button><button class="row addrow" data-act="hold">Add investment</button></div></section>
  <section><h2>Property and assets <small>${fmt(t.prop)}</small></h2><div class="list">${props||`<div class="empty">Add your home, land, car or gold.</div>`}<button class="row addrow" data-act="prop">Add property or asset</button></div></section>
  <section><h2>Loans <small>${fmt(t.loans)} outstanding</small></h2><div class="list">${loans||`<div class="empty">Add home, car or personal loans. Outstanding updates by itself on each EMI date.</div>`}<button class="row addrow" data-act="loan">Add loan</button></div></section>`;
}
function vHistory(){
  const sn=S.snapshots; let chart="";
  if(sn.length>1){
    const W=500,H=170,P=24,vals=sn.flatMap(s=>[s.liquid,s.total].filter(x=>x!=null)),mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
    const xy=(i,v)=>[P+i*(W-2*P)/(sn.length-1),H-P-(v-mn)/rg*(H-2*P)];
    const line=(k,c)=>{const pts=sn.map((s,i)=>s[k]!=null?xy(i,s[k]):null).filter(Boolean);return pts.length>1?`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>`:""};
    chart=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Net worth over time">${line("total","var(--muted)")}${line("liquid","var(--plus)")}
      <text x="${P}" y="14" font-size="11" fill="var(--muted)">${fmt(mx)}</text><text x="${P}" y="${H-4}" font-size="11" fill="var(--muted)">${fmt(mn)}</text></svg>
      <p class="note" style="margin:4px 0 0"><span class="plus">━</span> Liquid <span style="margin-left:12px">━</span> Total</p></div>`;
  }
  return `<section><h2>Weekly snapshots</h2>${chart}<div class="list" style="margin-top:10px">
    <button class="row addrow" data-act="snap">Save today’s snapshot</button>
    ${[...sn].reverse().map((s,i,a)=>{const prev=a[i+1];const d=prev?s.liquid-prev.liquid:null;
      return `<button class="row" data-act="snapitem" data-id="${s.date}"><span class="name"><b>${dLong(s.date)}</b><span>${d===null?"first snapshot":pm(d)+" liquid vs previous"}${s.total!=null?`, total ${sgn(s.total)}`:""}</span></span><span class="amt">${sgn(s.liquid)}</span></button>`}).join("")}
  </div></section>
  <section><h2>Backup</h2><div class="list"><button class="row addrow" data-act="export">Export a backup file</button><button class="row addrow" data-act="import">Import a backup file</button><button class="row addrow" data-act="reset" style="color:var(--minus)">Erase this ledger</button></div>
  <p class="note">Your data lives only in this browser. Export a backup now and then, and import it to move to another phone or laptop.</p></section>`;
}

/* ---------- sheets ---------- */
const dlg=document.getElementById("dlg"), sheet=document.getElementById("sheet");
function open(html,onReady){sheet.innerHTML=html;if(!dlg.open)dlg.showModal();sheet.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>dlg.close());onReady&&onReady();sheet.scrollTop=0}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
const $=id=>sheet.querySelector("#"+id);
const val=id=>$(id).value;
const num=id=>N(val(id));
const field=(id,label,v="",type="text",cls="")=>`<label class="f"><span>${label}</span><input id="${id}" type="${type==="number"?"text":type}" ${type==="number"?'inputmode="decimal"':""} class="${cls}" value="${esc(v)}"></label>`;
const sel=(id,label,opts,cur)=>`<label class="f"><span>${label}</span><select id="${id}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(cur)?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
const chk=(id,label,on)=>`<div class="toggle"><input type="checkbox" id="${id}" ${on?"checked":""}><label for="${id}">${label}</label></div>`;
const acctOpts=()=>S.accounts.map(a=>[`a:${a.id}`,`${a.name} (${fmt(a.balance)})`]);
const done=()=>{dlg.close();commit()};
const confirmDel=(name,fn)=>{if(confirm(`Remove ${name}?`)){fn();done()}};

function act(kind,id,ds){
  ({acct:()=>editAccount(id),recv:()=>editRecv(id),pay:()=>editPay(id),budget:()=>editBudget(id,ds.kind),income:()=>editIncome(id),
    logitem:()=>editLog(id),showzeros:showZeros,newmonth:newMonth,snap:snapshot,snapitem:()=>snapItem(id),goto:()=>go(id),
    hold:()=>editHolding(id),cas:importCAS,prop:()=>editProp(id),loan:()=>editLoan(id),
    import:importBackup,export:exportBackup,
    reset:()=>{if(confirm("Erase everything in this ledger on this device? Export a backup first if you want to keep it.")){try{localStorage.removeItem("ledger")}catch(e){}S=null;renderStart()}}
  })[kind]?.();
}

function editAccount(id){
  const a=S.accounts.find(x=>x.id===id);
  open(`<h3>${a?"Update balance":"Add account"}</h3>${field("n","Name",a?.name||"")}${field("b","Balance",a?a.balance:"","number","amount")}
  <div class="btns">${a?`<button class="btn danger" id="del">Remove</button>`:""}<button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">Save</button></div>`,()=>{
    $("ok").onclick=()=>{const n=val("n").trim();if(!n)return;a?Object.assign(a,{name:n,balance:num("b")}):S.accounts.push({id:uid(),name:n,balance:num("b")});done()};
    a&&($("del").onclick=()=>confirmDel(a.name,()=>S.accounts=S.accounts.filter(x=>x!==a)));
  });
}

const BASIS=[["now","Count now"],["projected","Projected month-end only"],["off","Don’t count"]];
function editRecv(id){
  const r=S.receivables.find(x=>x.id===id);
  if(!r) return open(`<h3>Add receivable</h3>${field("n","Who owes you")}${field("b","Amount","","number","amount")}${field("note","Note (optional)")}${sel("basis","How to count it",BASIS,"now")}
    <div class="btns"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">Add</button></div>`,()=>{
    $("ok").onclick=()=>{const n=val("n").trim();if(!n)return;S.receivables.push({id:uid(),name:n,note:val("note").trim(),basis:val("basis"),entries:[{amt:num("b"),date:today()}]});done()}});
  let mode="more";
  const others=S.receivables.filter(x=>x!==r).map(x=>[x.id,`${x.name} (${fmt(rAmt(x))})`]);
  open(`<h3>${esc(r.name)}, ${fmt(rAmt(r))}</h3>
    <div class="seg"><button aria-pressed="true" data-m="more">Owes more</button><button aria-pressed="false" data-m="got">Received</button><button aria-pressed="false" data-m="move">Move</button></div>
    ${field("b","Amount",rAmt(r)>0?rAmt(r):"","number","amount")}
    <div id="gotW" hidden>${sel("into","Received into",[["","Don’t change any balance"],...acctOpts()],acctOpts()[0]?.[0]||"")}</div>
    <div id="moveW" hidden>${sel("to","Move to",[...others,["__new","Someone new…"]],"__new")}<div id="newW">${field("newName","Their name")}</div>
      <p class="note">Knocks this amount off ${esc(r.name)} and adds it to the person you choose, like salary or lease paid into a family member’s account.</p></div>
    <div class="btns"><button class="btn primary" id="add">Add entry</button></div>
    ${field("note","Note",r.note||"")}${sel("basis","How to count it",BASIS,r.basis)}
    <div class="entries">${r.entries.slice(-12).map(e=>`<div><span>${dShort(e.date)||"opening"}${e.note?", "+esc(e.note):""}</span><span class="${e.amt<0?"minus":"plus"}">${pm(e.amt)}</span></div>`).join("")}</div>
    <div class="btns"><button class="btn danger" id="del">Remove</button><button class="btn" id="save">Done</button></div>`,()=>{
    const setMode=m=>{mode=m;sheet.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===m));$("gotW").hidden=m!=="got";$("moveW").hidden=m!=="move";$("add").textContent={more:"Add entry",got:"Mark received",move:"Move amount"}[m]};
    sheet.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
    $("to").onchange=()=>$("newW").hidden=val("to")!=="__new";
    const meta=()=>{r.note=val("note").trim();r.basis=val("basis")};
    $("add").onclick=()=>{const a=num("b");if(!a)return;meta();
      if(mode==="more") r.entries.push({amt:a,date:today()});
      if(mode==="got"){r.entries.push({amt:-a,date:today(),note:"received"});const acc=S.accounts.find(x=>"a:"+x.id===val("into"));acc&&(acc.balance+=a)}
      if(mode==="move"){let t=S.receivables.find(x=>x.id===val("to"));
        if(!t){const n=val("newName").trim();if(!n)return;t={id:uid(),name:n,note:"",basis:"now",entries:[]};S.receivables.push(t)}
        r.entries.push({amt:-a,date:today(),note:"moved to "+t.name});t.entries.push({amt:a,date:today(),note:"from "+r.name})}
      done()};
    $("save").onclick=()=>{meta();done()};
    $("del").onclick=()=>confirmDel(r.name,()=>{S.receivables=S.receivables.filter(x=>x!==r);S.incomes.forEach(i=>{if(i.recvId===r.id)i.recvId=null})});
  });
}

function editPay(id){
  const p=S.payables.find(x=>x.id===id);
  open(`<h3>${p?esc(p.name):"Add card or due"}</h3>${field("n","Name",p?.name||"")}${field("b","Amount owed",p?p.amount:"","number","amount")}${field("d","Due date (empty if not billed)",p?.due||"","date")}
    ${p&&p.amount>0&&S.accounts.length?`${sel("from","Pay it from",acctOpts(),acctOpts()[0][0])}<button class="btn primary" id="paid" style="width:100%">Mark paid</button>`:""}
    <div class="btns">${p?`<button class="btn danger" id="del">Remove</button>`:""}<button class="btn" data-close>Cancel</button><button class="btn ${p&&p.amount>0?"":"primary"}" id="ok">Save</button></div>`,()=>{
    $("ok").onclick=()=>{const n=val("n").trim();if(!n)return;const o={name:n,amount:num("b"),due:val("d")||null};p?Object.assign(p,o):S.payables.push({id:uid(),...o});done()};

function showZeros(){
  const z=S.payables.filter(p=>p.amount===0);

    sheet.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>editPay(b.dataset.z))});

function editBudget(id,kind){
  const b=S.budgets.find(x=>x.id===id); kind=b?.kind||kind||"exp";
  open(`<h3>${b?esc(b.name):kind==="exp"?"Add monthly expense":"Add monthly investment"}</h3>

    $("ok").onclick=()=>{const n=val("n").trim();if(!n)return;const o={name:n,budget:num("m"),spent:num("s"),carryIn:num("c"),carryOn:$("co").checked};b?Object.assign(b,o):S.budgets.push({id:uid(),kind,...o});done()};

function accrue(i,m){
  if(i.accrued.includes(m)) return;
  let r=S.receivables.find(x=>x.id===i.recvId);
  if(!r){r={id:uid(),name:i.name,note:"Monthly income",basis:"projected",entries:[]};S.receivables.push(r);i.recvId=r.id}
  r.entries.push({amt:N(i.amount),date:today(),note:"accrued "+mLabel(m)}); i.accrued.push(m);
  if(i.accrued.length>36) i.accrued=i.accrued.slice(-36);
}
function editIncome(id){
  const i=S.incomes.find(x=>x.id===id);
  if(!i) return open(`<h3>Add monthly income</h3>${field("n","Name","")}${field("a","Monthly amount","","number","amount")}
    ${chk("now",`Accrue for ${mLabel(S.month)} now`,true)}
    <p class="note">Salary, rental income, fuel or driver reimbursement, anything that comes in each month.</p>
    <div class="btns"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">Add</button></div>`,()=>{
    $("ok").onclick=()=>{const n=val("n").trim();if(!n)return;const x={id:uid(),name:n,amount:num("a"),recvId:null,accrued:[]};S.incomes.push(x);if($("now").checked)accrue(x,S.month);done()}});
  const r=S.receivables.find(x=>x.id===i.recvId), out=r?rAmt(r):0, doneM=i.accrued.includes(S.month);

function newMonth(){
  const target=S.month<mKey()?mKey():nextM(S.month);
  const preview=S.budgets.filter(b=>b.carryOn).reduce((a,b)=>a+left(b),0);
  if(!confirm(`Close ${mLabel(S.month)} and start ${mLabel(target)}?\n\nCarry-over lines move ${pm(preview)} into the new month; other lines reset. Monthly income is accrued for ${mLabel(target)}.\n\nSave a snapshot first if you want a record of ${mLabel(S.month)}.`)) return;
  S.budgets.forEach(b=>{b.carryIn=b.carryOn?left(b):0;b.spent=0});
  S.month=target; S.incomes.forEach(i=>accrue(i,target)); commit();
}

/* ---------- CAS import: read on this device only ---------- */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadPdfJs(){return window.pdfjsLib?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement("script");s.src=PDFJS+"pdf.min.js";s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";res()};s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
async function pdfText(file,password){
  await loadPdfJs();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),password}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const c=await (await doc.getPage(p)).getTextContent(); let y=null,line="";
    for(const it of c.items){const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>2){lines.push(line);line=""}line+=(line&&it.str?" ":"")+it.str;y=yy}
    lines.push(line);
  }
  return lines.map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean).join("\n");
}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function dmy(s){const m=/(\d{1,2})-([A-Za-z]{3})-(\d{4})/.exec(s||"");return m?ymd(new Date(+m[3],MON[m[2].toLowerCase()],+m[1])):today()}
function cleanScheme(s){return s.replace(/^[A-Z0-9]{2,12}\s*-\s*/,"").replace(/\(\s*(Advisor|formerly|Non-Demat|Demat)[^)]*\)/gi,"").replace(/Registrar\s*:.*$/i,"").replace(/[\s-]+$/,"").trim()}
function parseCAS(text){
  const t=text.replace(/\u00a0/g," ");
  const hits=[...t.matchAll(/Closing\s+Unit\s+Balance\s*:?\s*([\d,]+\.?\d*)/gi)];
  const out=[],skipped=[];
  hits.forEach((m,i)=>{
    const prevEnd=i?hits[i-1].index+hits[i-1][0].length:0;
    const block=t.slice(Math.max(prevEnd,m.index-8000),m.index);   // this fund only
    const wide=t.slice(Math.max(0,m.index-8000),m.index);           // for folio header
    const end=i+1<hits.length?hits[i+1].index:t.length;
    const after=t.slice(m.index,Math.min(end,m.index+2500));
    let name="",isin=null;
    const last=[...block.matchAll(/ISIN\s*:?\s*(INF[A-Z0-9]{9})/g)].pop();
    if(last){
      isin=last[1];
      const ls=block.lastIndexOf("\n",last.index)+1;
      let nm=cleanScheme(block.slice(ls,last.index));
      if(nm.length<8){const ps=block.lastIndexOf("\n",ls-2)+1;nm=cleanScheme(block.slice(ps,Math.max(ps,ls-1))+" "+nm)}
      if(nm.length>150) nm=nm.slice(-150).trim();
      name=nm;
    }
    if(!name){
      const n=[...block.matchAll(/([A-Z][A-Za-z0-9&().'\- ]{4,120}?(?:Fund|ETF|FoF|Plan|Option)\b[A-Za-z0-9&().'\- ]{0,60})/g)].pop();
      if(n) name=cleanScheme(n[1]);
    }
    if(!name) name="Mutual fund";
    const units=N(m[1]);
    if(units<=0){skipped.push({name,why:"zero balance (fully redeemed)"});return}
    const mv=/Market\s+Value(?:\s+on)?\s*([0-9]{1,2}-[A-Za-z]{3}-[0-9]{4})?\s*:?\s*(?:INR|Rs\.?|₹)?\s*([\d,]+\.?\d*)/i.exec(after);
    if(!mv){skipped.push({name,why:"market value not found"});return}
    const cost=/(?:Total\s+)?Cost\s+Value\s*:?\s*(?:INR|Rs\.?|₹)?\s*([\d,]+\.?\d*)/i.exec(after);
    const fm=[...wide.matchAll(/Folio\s*No\.?\s*:?\s*([0-9A-Z\/ ]{3,30}?)(?=\s+(?:PAN|KYC)|\n|$)/gim)].pop();
    out.push({name,isin,folio:fm?fm[1].trim():"",units,cost:cost?N(cost[1]):0,value:N(mv[2]),asOf:dmy(mv[1])});
  });
  const seen=new Set();
  const funds=out.filter(h=>{const k=[h.isin||h.name,h.folio,h.units,h.value].join("|");if(seen.has(k))return false;seen.add(k);return true});
  parseCAS.skipped=skipped;parseCAS.blocks=hits.length;
  return funds;
}
function casSkippedHTML(){
  const s=parseCAS.skipped||[];
  if(!s.length) return "";
  return `<div class="warnbox">${parseCAS.blocks} funds found in the PDF. Not added:<br>${s.map(x=>`${esc(x.name)}: ${x.why}`).join("<br>")}</div>`;
}
function importCAS(){
  open(`<h3>Import mutual funds</h3>
    <p class="note" style="margin-top:0">Use the detailed Consolidated Account Statement (CAS) PDF from CAMS or KFintech. Request it free on their websites by email; it covers every fund you hold. The file is read on this device and never uploaded.</p>
    ${field("pw","PDF password (usually your PAN in capitals)","","text")}
    <button class="btn primary" id="pick" style="width:100%">Choose CAS PDF</button>
    <div id="res"></div><div class="btns"><button class="btn" data-close>Close</button></div>`,()=>{
    $("pw").setAttribute("autocapitalize","characters");$("pw").setAttribute("autocomplete","off");
    $("pick").onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept="application/pdf,.pdf";
      inp.onchange=async()=>{const f=inp.files[0];if(!f)return;$("res").innerHTML=`<p class="note">Reading ${esc(f.name)}…</p>`;
        let text;
        try{text=await pdfText(f,val("pw").trim()||undefined)}
        catch(e){$("res").innerHTML=`<div class="warnbox">${e&&e.name==="PasswordException"?"The password didn’t open this PDF. CAS passwords are usually your PAN in capital letters.":e&&e.message==="load"?"Couldn’t load the PDF reader. Check your internet connection and try again.":"Couldn’t read this PDF. Make sure it’s the CAS statement, not a scanned image."}</div>`;return}
        const found=parseCAS(text);
        if(!found.length){$("res").innerHTML=`<div class="warnbox">No fund balances found. This importer reads the detailed CAS from CAMS or KFintech. Summary statements or other formats aren’t supported yet, so add funds by hand for now.</div>`;return}
        const tot=found.reduce((a,h)=>a+h.value,0);
        $("res").innerHTML=`<h3 style="margin-top:16px">${found.length} funds, ${fmt(tot)}</h3>
          ${found.map((h,i)=>`<label class="pick"><input type="checkbox" data-i="${i}" checked><span class="name">${esc(h.name)}<br><span class="sub">${h.units} units${h.cost?`, cost ${fmt(h.cost)}`:""}, as of ${dShort(h.asOf)}</span></span><span class="amt">${fmt(h.value)}</span></label>`).join("")}
          ${casSkippedHTML()}${chk("rep","Replace mutual funds imported earlier",true)}
          <button class="btn primary" id="save" style="width:100%">Add selected funds</button>`;
        $("save").onclick=()=>{const pick=[...sheet.querySelectorAll("[data-i]")].filter(x=>x.checked).map(x=>found[+x.dataset.i]);
          if($("rep").checked) S.holdings=S.holdings.filter(h=>h.source!=="cas");
          pick.forEach(h=>S.holdings.push({id:uid(),type:"Mutual fund",source:"cas",liquid:false,...h}));done()};
      };inp.click()};
  });
}

function logExpense(){
  if(!S) return;
  const opt=b=>`<option value="${b.id}">${esc(b.name)} (${fmt(left(b))} left)</option>`;
  const ex=S.budgets.filter(b=>b.kind==="exp"), iv=S.budgets.filter(b=>b.kind==="inv");
  const cards=S.payables.map(p=>`<option value="p:${p.id}">${esc(p.name)} card</option>`).join("");
  open(`<h3>Log expense</h3>${field("b","Amount","","number","amount")}${field("note","What for","")}
    <label class="f"><span>Category</span><select id="cat">${ex.length?`<optgroup label="Monthly expenses">${ex.map(opt).join("")}</optgroup>`:""}${iv.length?`<optgroup label="Monthly investments">${iv.map(opt).join("")}</optgroup>`:""}<option value="">Other, outside the monthly plan</option></select></label>
    <label class="f"><span>Paid from</span><select id="src"><optgroup label="Bank and cash">${S.accounts.map(a=>`<option value="a:${a.id}">${esc(a.name)} (${fmt(a.balance)})</option>`).join("")}</optgroup>${cards?`<optgroup label="Cards">${cards}</optgroup>`:""}</select></label>
    ${field("d","Date",today(),"date")}
    <div class="btns"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">Log it</button></div>`,()=>{
    $("b").focus();
    $("ok").onclick=()=>{const amt=num("b");if(amt<=0)return;const b=S.budgets.find(x=>x.id===val("cat"));
      if(b) b.spent+=amt; applySrc(val("src"),amt);
      S.log.push({id:uid(),date:val("d")||today(),amt,note:val("note").trim(),cat:b?b.name:"Other",budgetId:b?b.id:null,src:val("src")});
      if(S.log.length>500) S.log=S.log.slice(-500); done()};
  });
}
function applySrc(src,amt){const [k,id]=String(src).split(":");if(k==="a"){const a=S.accounts.find(x=>x.id===id);a&&(a.balance-=amt)}else{const p=S.payables.find(x=>x.id===id);p&&(p.amount+=amt)}}
function editLog(id){const l=S.log.find(x=>x.id===id);
  open(`<h3>${fmt(l.amt)}, ${esc(l.note||l.cat)}</h3><p class="note">${dLong(l.date)}, ${esc(l.cat)}, paid from ${esc(srcName(l.src))}</p>
  <div class="btns"><button class="btn danger" id="del">Delete and undo</button><button class="btn" data-close>Close</button></div>`,()=>{
  $("del").onclick=()=>{applySrc(l.src,-l.amt);const b=S.budgets.find(x=>x.id===l.budgetId);b&&(b.spent=Math.max(0,b.spent-l.amt));S.log=S.log.filter(x=>x!==l);done()}})}
